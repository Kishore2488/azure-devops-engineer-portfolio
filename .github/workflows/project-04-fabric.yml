name: Project 04 - Fabric Validation
on:
  push:
    branches: [main, develop]
    paths: [projects/04-fabric-ops/**]
  pull_request:
    paths: [projects/04-fabric-ops/**]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/04-fabric-ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python validate.py sample.json
