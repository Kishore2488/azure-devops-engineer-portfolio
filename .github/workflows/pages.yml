name: Publish Portfolio

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "projects/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          python -m pip install --upgrade pip pillow edge-tts
          mkdir -p build _site/videos

      - name: Generate professional male narration
        shell: bash
        run: |
          VOICEOVER="I'm Venkata Kishore Vusa, an Azure DevOps and Cloud Engineer based in Hyderabad, India. I enjoy turning complicated release processes into secure, repeatable workflows that help teams ship with confidence. My work focuses on GitHub Actions, YAML-based CI/CD pipelines, deployment approvals, and quality gates across development, testing, and production environments. I work across Azure and AWS, choosing automation and infrastructure as code to make environments more consistent and easier to maintain. Ansible is one of my favorite tools for reducing repetitive configuration tasks and making deployments predictable. I also work with Docker and Kubernetes concepts to package applications, manage rollouts, and improve operational consistency. On the Microsoft Fabric side, I support governed workspace deployments, secret management, and validation of data synchronization before release. Security is part of the delivery process, not an afterthought: I value least-privilege access, protected branches, secrets management, and practical DevSecOps checks. When a deployment fails, I focus on tracing the cause, communicating clearly, and documenting the fix so the team can learn from it. My portfolio includes hands-on examples for CI/CD, Ansible automation, container delivery, Fabric release operations, and security gates. I bring more than four years of experience and a continuous-learning mindset. Explore the projects and runbooks, review the workflow evidence, and connect with me if you're looking for an engineer who cares about reliable releases, cloud automation, and secure delivery. Let's build a safer path from code to production."
          if ! edge-tts --voice en-US-GuyNeural --rate=-4% --text "$VOICEOVER" --write-media build/narration.mp3; then
            echo "::warning::Neural male voice service was unavailable; using local synthetic male voice as fallback."
            espeak -v en+m3 -s 145 -w build/narration.wav "$VOICEOVER"
            ffmpeg -y -loglevel error -i build/narration.wav build/narration.mp3
          fi
          test -s build/narration.mp3

      - name: Render 90-second cinematic intro
        run: |
          python scripts/generate_intro.py
          test -s _site/videos/kishore-intro.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 _site/videos/kishore-intro.mp4

      - name: Prepare static site
        run: |
          cp index.html 404.html styles.css script.js _site/
          cp -r projects _site/

      - name: Validate portfolio project links and video asset
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
                  self.media = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  self.hrefs.extend([attrs["href"]] if attrs.get("href") else [])
                  if tag == "source" and attrs.get("src"):
                      self.media.append(attrs["src"])

          parser = Links()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          paths = [p for p in parser.hrefs if p.startswith("projects/")]
          if len(paths) < 5:
              raise SystemExit(f"Expected at least 5 project links, found {len(paths)}")
          for path in paths:
              target = Path(path)
              if target.is_dir():
                  target = target / "index.html"
              if not target.is_file():
                  raise SystemExit(f"Broken portfolio project link: {path}")
          for required in ["index.html", "404.html", "styles.css", "script.js"]:
              if not Path(required).is_file():
                  raise SystemExit(f"Missing site asset: {required}")
          if "videos/kishore-intro.mp4" not in parser.media:
              raise SystemExit("Portfolio intro video is not referenced by the page")
          if not Path("_site/videos/kishore-intro.mp4").is_file():
              raise SystemExit("Generated intro video is missing from Pages artifact")
          print(f"PASS: validated {len(paths)} project links, required assets and intro video")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
