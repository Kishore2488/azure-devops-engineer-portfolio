name: Project 03 - Container Publish
on:
  push:
    branches: [main]
    paths: [projects/03-aks-app/**]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: projects/03-aks-app
          push: true
          tags: ghcr.io/kishore2488/aks-demo:latest
