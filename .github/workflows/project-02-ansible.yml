name: Project 02 - Ansible Validation
on:
  push:
    branches: [main, develop]
    paths: [projects/02-ansible-real-server/**]
  pull_request:
    paths: [projects/02-ansible-real-server/**]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - run: ansible-lint projects/02-ansible-real-server
      - run: ansible-playbook -i projects/02-ansible-real-server/inventory/dev.ini projects/02-ansible-real-server/site.yml --syntax-check
