name: CI - FastAPI

on:
  push:
    branches: [main, develop]
    paths: [projects/01-cicd-fastapi-app/**]
  pull_request:
    paths: [projects/01-cicd-fastapi-app/**]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/01-cicd-fastapi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: projects/01-cicd-fastapi-app
          push: false
          tags: kishore/cicd-fastapi-app:ci
