- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Publish application page
  ansible.builtin.copy:
    content: |
      <!doctype html>
      <html><body><h1>Deployed by Ansible</h1><p>DevOps portfolio application</p></body></html>
    dest: /var/www/html/index.html
    mode: "0644"
  notify: Restart nginx

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
